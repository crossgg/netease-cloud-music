# 配置文件版本
version: 1.0
# log 日志模块配置
log:
  # 应用名称
  app: ncm
  # 日志输出格式 text json
  format: text
  # 日志级别 debug < info < warn < error
  level: info
  # 日志是否输出到标准输出
  stdout: false
  # 滚动日志配置
  rotate:
    # 日志文件保存路径
    filename: "${HOME}/.ncmctl/log/ncm.log"
    # 单个日志文件最大大小,单位MB
    maxsize: 100
    # 日志文件保留天数
    maxage: 7
    # 日志文件保留最大数量
    maxbackups: 3
    # 日志打印是否使用本地时间
    localtime: true
    # 日志文件是否压缩
    compress: true
# 网络模块配置
network:
  # 是否开启调试模式
  debug: false
  # 请求超时时间
  timeout: 60s
  # 当网络出现问题重试次数
  retry: 3
  # cookie 配置用于保存登录相关信息
  cookie:
    # cookie 文件保存路径
    filepath: "${HOME}/.ncmctl/cookie.json"
    # cookie 刷盘间隔,如果间隔过大当程序崩溃或退出,可能导致cookie值不能刷到磁盘中.如果间隔过小,会导致频繁刷盘,影响性能.
    interval: 3s
# 数据缓存配置
database:
  # 缓存驱动,目前支持badger
  driver: badger
  # 缓存目录
  path: "${HOME}/.ncmctl/database/badger/"

# 音乐人黑胶会员任务配置
musicianVip:
  # 笔记发布任务配置
  note:
    # 笔记内容（支持多条，随机选择一条）
    messages:
      - "分享一首好听的歌~"
      - "音乐是最好的陪伴"
      - "今天也要好好听歌呀"
      - "用音乐记录生活"
    # 图片URL列表（支持多条，随机选择一张）
    imageUrls:
      - "https://picsum.photos/800/600"
    # 动态类型: 35=普通动态, 39=图文笔记
    type: 35
  # 播放任务配置
  play:
    # 歌曲ID列表（逗号分隔）
    ids: ""
    # 歌曲ID文件路径
    idsFile: ""
    # 每次播放数量
    num: 300
    # 两首歌之间最小间隔秒数
    gapMin: 5
    # 两首歌之间最大间隔秒数
    gapMax: 20
    # 非默认cookie文件路径（用于playids任务，留空则使用默认cookie）
    cookieFile: ""
